name: 🐞 Bug report
description: Report a reproducible Fleet Commander problem
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Fleet Commander problem.

        **Do not include passwords, credentials, private session links, API keys or other sensitive information.**

  - type: input
    id: version
    attributes:
      label: Fleet Commander version
      placeholder: "0.10.27-beta"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 151 / Firefox / Edge / Opera GX ..."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system / device
      placeholder: "Windows 11 Desktop / Android Tablet / iPhone ..."
    validations:
      required: true

  - type: dropdown
    id: formfactor
    attributes:
      label: Device class
      options:
        - Desktop
        - Laptop
        - Tablet
        - Smartphone
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: fleetcontext
    attributes:
      label: Fleet / ship context
      description: If relevant, include ship name, role, crew count or Fleet Overview status. Do not include private session links.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / additional information

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included passwords, credentials or a private session URL.
          required: true
        - label: I checked whether the issue still occurs after reloading Fleet Commander.
          required: true
